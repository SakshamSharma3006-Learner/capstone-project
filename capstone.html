<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Product Inventory & Analytics Dashboard</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f25;
    --text: #e6e8eb;
    --muted: #8b93a0;
    --accent: #4fd1a5;
    --warn: #f2b04c;
    --border: #2b3039;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 720px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }
  .bar { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  button {
    background: var(--accent);
    color: #0d1f18;
    border: 0;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  button:focus-visible { outline: 2px solid var(--warn); outline-offset: 2px; }
  #console {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 0;
    font-family: Consolas, "Courier New", monospace;
    font-size: 0.9rem;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 260px;
    overflow-x: auto;
  }
  #console .head { color: var(--accent); font-weight: 700; }
  #console .warn { color: var(--warn); }
  .note { color: var(--muted); font-size: 0.85rem; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1>Product Inventory &amp; Analytics Dashboard</h1>
  <p class="sub">Console-based capstone: output shows below and in the browser console (F12).</p>
  <div class="bar">
    <button id="runBtn">Run inventory system</button>
    <button id="clearBtn" class="ghost">Clear output</button>
  </div>
  <pre id="console" aria-live="polite">Click "Run inventory system" to start.</pre>
  <p class="note">Tip: Open DevTools (F12) &rarr; Console to see the same output.</p>
</main>

<script>
/* =========================================================
   Interactive Product Inventory & Analytics Dashboard
   Concepts: prompt, type conversion, if/else, switch, loops,
   break/continue, functions, arrow functions, scope, closures,
   forEach, filter, map
   ========================================================= */

const out = document.getElementById("console");

// Prints to the browser console AND the on-page output panel
function log(message, type = "") {
  console.log(message);
  const line = document.createElement("span");
  if (type) line.className = type;
  line.textContent = message + "\n";
  out.appendChild(line);
}

/* ---------- 2. CONTROL FLOW: category rules ---------- */

// Dynamic price thresholds
const BUDGET_LIMIT = 100;
const PREMIUM_LIMIT = 500;

// if...else: assign category based on price
function getCategory(price) {
  if (price < BUDGET_LIMIT) {
    return "Budget";
  } else if (price < PREMIUM_LIMIT) {
    return "Standard";
  } else {
    return "Premium";
  }
}

// switch: assign a badge for each category
function getBadge(category) {
  switch (category) {
    case "Budget":
      return "[B]";
    case "Standard":
      return "[S]";
    case "Premium":
      return "[P]";
    default:
      return "[?]";
  }
}

// Validate user input (if...else)
function validateInput(name, price) {
  if (name === null || name === "") {
    return "Product name is missing.";
  } else if (!isNaN(Number(name))) {
    return "Product name cannot be only a number.";
  } else if (isNaN(price)) {
    return "Price must be a number.";
  } else if (price <= 0) {
    return "Price must be greater than 0.";
  }
  return "OK";
}

/* ---------- 3. LOOPS: search with break/continue ---------- */

// Returns the index of an item by name, or -1 if not found
function findProductIndex(inventory, name) {
  let foundIndex = -1;
  for (let i = 0; i < inventory.length; i++) {
    if (!inventory[i].name) {
      continue; // skip bad/empty records
    }
    if (inventory[i].name.toLowerCase() === name.toLowerCase()) {
      foundIndex = i;
      break; // stop as soon as we find it
    }
  }
  return foundIndex;
}

// Asks the user for input, retries on bad input (max 3 attempts)
function askForProduct(inventory) {
  const MAX_ATTEMPTS = 3;

  for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
    const nameInput = prompt("Enter new product name:");

    // User pressed Cancel -> stop the loop
    if (nameInput === null) {
      log("Input cancelled by user.", "warn");
      break;
    }

    const priceInput = prompt("Enter price for \"" + nameInput.trim() + "\":");
    if (priceInput === null) {
      log("Input cancelled by user.", "warn");
      break;
    }

    // Explicit type conversion
    const name = String(nameInput).trim();
    const price = parseFloat(priceInput);

    const result = validateInput(name, price);
    if (result !== "OK") {
      log("Attempt " + attempt + ": " + result + " Try again.", "warn");
      continue; // bad input -> next attempt
    }

    // Duplicate check using the search function
    if (findProductIndex(inventory, name) !== -1) {
      log("Attempt " + attempt + ": \"" + name + "\" already exists. Try a different name.", "warn");
      continue;
    }

    return { name: name, price: price }; // valid input
  }
  return null; // no valid product added
}

/* ---------- 4. FUNCTIONS & SCOPE ---------- */

// Regular function: total inventory value
function calculateTotal(items) {
  let total = 0; // local scope - not accessible outside
  for (const item of items) {
    total += item.price;
  }
  return total;
}

// Arrow functions: tax and discount helpers
const applyTax = (amount, taxPercent) => amount + (amount * taxPercent) / 100;
const applyDiscount = (amount, discountPercent) => amount - (amount * discountPercent) / 100;

// Closure: secure local scope - rates are private and cannot be changed from outside
function createPriceCalculator(taxPercent, discountPercent) {
  const tax = taxPercent;           // private
  const discount = discountPercent; // private
  return (amount) => applyTax(applyDiscount(amount, discount), tax);
}

/* ---------- MAIN PROGRAM ---------- */

function runInventorySystem() {
  out.textContent = ""; // clear old output

  log("--- Initializing Inventory System ---", "head");

  // 1. Pre-existing items (array of objects)
  const inventory = [
    { name: "Laptop", price: 800 },
    { name: "Mouse", price: 25 }
  ];

  // Take new product from user
  const newProduct = askForProduct(inventory);

  if (newProduct) {
    inventory.push(newProduct);
    log("[Prompt executed: User adds \"" + newProduct.name + "\" at \"$" + newProduct.price + "\"]");
  } else {
    log("[No new product added]", "warn");
  }

  // Add category to every item
  inventory.forEach((item) => {
    item.category = getCategory(item.price);
    item.badge = getBadge(item.category);
  });

  // 5. forEach: log the inventory sheet
  log("\n--- Processing Inventory Roster (forEach) ---", "head");
  inventory.forEach((item) => {
    log("* Item: " + item.name + " ($" + item.price + ") -> Category: " + item.category + " " + item.badge);
  });

  // Financial analytics
  log("\n--- Financial Analytics ---", "head");

  const total = calculateTotal(inventory);
  log("Total Inventory Value: $" + total);

  // filter: items under $200
  const affordable = inventory.filter((item) => item.price < 200);
  const affordableNames = affordable.map((item) => item.name);
  log("Filtered Affordable Items (Under $200): " + JSON.stringify(affordableNames));

  // map: formatted report list
  const report = inventory.map((item) => item.name.toUpperCase() + ": $" + item.price);
  log("Formatted Report List: " + JSON.stringify(report));

  // Bonus: tax & discount using functions/closure
  log("\n--- Tax & Discount Demo ---", "head");
  const calculateFinalPrice = createPriceCalculator(18, 10); // 18% tax, 10% discount
  log("Total with 10% discount + 18% tax: $" + calculateFinalPrice(total).toFixed(2));
  log("Total with tax only (18%): $" + applyTax(total, 18).toFixed(2));
}

document.getElementById("runBtn").addEventListener("click", runInventorySystem);
document.getElementById("clearBtn").addEventListener("click", () => { out.textContent = ""; });
</script>
</body>
</html>
